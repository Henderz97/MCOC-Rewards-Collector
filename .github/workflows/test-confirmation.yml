name: Test reward confirmation
on:
  push:
    branches: [main]
    paths:
      - Collect_Rewards.py
      - tests/**
      - .github/workflows/test-confirmation.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          MCOC_BROWSER_TESTS: '1'
