name: Collect Game Rewards

on:
  schedule:
    - cron: '0 6 * * *' # Runs at 06:00 UTC
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # This installs the browser AND the Linux system libraries it needs
          playwright install chromium --with-deps 

      - name: Run script
        env:
          # This maps your GitHub Secrets to the script's environment variables
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python Collect_Rewards.py
