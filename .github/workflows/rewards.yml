name: MCOC Rewards Collector
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Collector
        env:
          KABAM_EMAIL: ${{ secrets.KABAM_EMAIL }}
          KABAM_PASSWORD: ${{ secrets.KABAM_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Collect_Rewards.py

      # Always upload — a partial claim exits non-zero now, but even on a clean
      # run the screenshots are what let us diagnose the next miss.
      - name: Upload debug pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcoc-debug-${{ github.run_number }}
          path: debug/
          retention-days: 7
          if-no-files-found: ignore
