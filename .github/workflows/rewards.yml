name: Collect Game Rewards

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # xvfb is the magic trick for "headless" popups
          sudo apt-get install xvfb
          python -m playwright install chromium --with-deps

      - name: Restore Session Cache
        uses: actions/cache@v4
        with:
          path: kabam_session.json
          key: ${{ runner.os }}-kabam-session-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kabam-session-

      - name: Run script with Virtual Display
        env:
          KABAM_EMAIL: ${{ secrets.KABAM_EMAIL }}
          KABAM_PASSWORD: ${{ secrets.KABAM_PASSWORD }}
          PYTHONUNBUFFERED: 1
        # xvfb-run makes the browser think it has a real screen
        run: xvfb-run --auto-servernum python Collect_Rewards.py

      - name: Upload Debug Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
