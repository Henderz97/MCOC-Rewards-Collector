name: MCOC Rewards Collector

on:
  schedule:
    - cron: '0 5 * * *' # ירוץ כל יום ב-8:00
  workflow_dispatch: # מאפשר הרצה ידנית

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Restore Session Cache
        uses: actions/cache@v3
        with:
          path: kabam_session.json
          key: ${{ runner.os }}-kabam-session-${{ hashFiles('**/Collect_Rewards.py') }}
          restore-keys: |
            ${{ runner.os }}-kabam-session-

      - name: Run Collector
        env:
          KABAM_EMAIL: ${{ secrets.KABAM_EMAIL }}
          KABAM_PASSWORD: ${{ secrets.KABAM_PASSWORD }}
        run: python Collect_Rewards.py

      # תיקון השגיאה: הוספת actions/ לפני upload-artifact
      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-results
          path: |
            *.png
            kabam_session.json

      - name: Save Session Cache
        if: always()
        uses: actions/cache/save@v3
        with:
          path: kabam_session.json
          key: ${{ runner.os }}-kabam-session-${{ hashFiles('**/Collect_Rewards.py') }}
